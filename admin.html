<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration | Rockets du Nord</title><style>body{font:16px system-ui;background:#f3f3f3;color:#151515;margin:0}header{background:#111;color:#ffd21a;padding:24px}main{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:12px;padding:20px;margin:12px 0}input,button{padding:10px;margin:5px;border:1px solid #ccc;border-radius:6px;font:inherit}button{cursor:pointer}button.primary{background:#ffd21a;border:0;font-weight:700}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}td button{font-size:12px}#data{overflow:auto}#error{color:#a00}</style></head><body><header><h1>ROCKETS DU NORD — Administration</h1></header><main><div class="card" id="login"><h2>Connexion privée</h2><form id="form"><input id="email" type="email" autocomplete="username" placeholder="Courriel" required><input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe" required><button class="primary">Connexion</button></form><p id="error"></p></div><div id="app" hidden><div class="card"><button id="logout">Déconnexion</button><h2>Réservations</h2><p id="summary"></p><div id="data"></div></div></div></main><script>
let token=sessionStorage.getItem('rocketAdminToken')||'';
const $=id=>document.getElementById(id);
async function request(method,body,login=false){const r=await fetch('/api/admin'+(login?'?action=login':''),{method,headers:{'Content-Type':'application/json',...(login?{}:{Authorization:'Bearer '+token})},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');return d}
async function load(){try{const rows=await request('GET');$('login').hidden=true;$('app').hidden=false;$('summary').textContent=rows.length+' numéros réservés · '+rows.filter(x=>x.status==='paid').length*20+' $ confirmés · '+rows.filter(x=>x.status==='pending').length*20+' $ en attente';const table=document.createElement('table'),head=document.createElement('tr');['N°','Joueur','Acheteur','Courriel','Statut','Actions'].forEach(s=>{const th=document.createElement('th');th.textContent=s;head.append(th)});table.append(head);rows.forEach(x=>{const tr=document.createElement('tr');[x.number,x.player,x.buyer_name,x.buyer_email,x.status==='paid'?'Payé':'En attente'].forEach(s=>{const td=document.createElement('td');td.textContent=s;tr.append(td)});const td=document.createElement('td');for(const [action,label] of [['paid','Marquer payé'],['pending','En attente'],['release','Libérer']]){const b=document.createElement('button');b.textContent=label;b.disabled=x.status===action;b.onclick=async()=>{if(action==='release'&&!confirm('Libérer le numéro '+x.number+' ?'))return;try{await request('POST',{id:x.id,action});await load()}catch(e){alert(e.message)}};td.append(b)}tr.append(td);table.append(tr)});$('data').replaceChildren(table)}catch(e){$('error').textContent=e.message;$('login').hidden=false;$('app').hidden=true}}
$('form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';try{const d=await request('POST',{email:$('email').value,password:$('password').value},true);token=d.access_token;sessionStorage.setItem('rocketAdminToken',token);$('password').value='';await load()}catch(e){$('error').textContent=e.message}};
$('logout').onclick=()=>{token='';sessionStorage.removeItem('rocketAdminToken');$('app').hidden=true;$('login').hidden=false};
if(token)load();
</script></body></html>
